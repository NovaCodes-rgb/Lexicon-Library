<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تحميل الكتب - حل مباشر ومضمون</title>
<style>
  :root {
    --ink: #1c1b18;
    --paper: #faf7f0;
    --accent: #b4622b;
    --accent-deep: #7a3f1a;
    --line: #ddd5c4;
    --muted: #847a68;
    --success: #2f7a3c;
    --success-bg: #e4f3e6;
    --warning: #a13f1c;
    --warning-bg: #fbe9e1;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding: 40px 20px; background: var(--paper); color: var(--ink);
    font-family: "Tahoma", "Segoe UI", sans-serif;
  }
  h1 { font-size: 24px; margin-bottom: 4px; }
  p.lead { color: var(--muted); margin-top:0; margin-bottom: 24px; max-width: 560px; line-height:1.6; }
  .search-bar { display:flex; gap:8px; max-width: 560px; margin-bottom: 32px; }
  .search-bar input {
    flex:1; padding: 12px 14px; border:1px solid var(--line); border-radius:8px; font-size:15px;
  }
  .search-bar button {
    padding: 12px 20px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer;
  }
  .search-bar button:hover { background:var(--accent-deep); }
  #results { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:18px; }
  .card {
    border:1px solid var(--line); border-radius:10px; padding:14px; background:#fff;
    display:flex; flex-direction:column; gap:10px; transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-2px); }
  .card img { width:100%; height:190px; object-fit:cover; border-radius:6px; background:#eee; }
  .card h3 { margin:0; font-size:14px; line-height:1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .author { color:var(--muted); font-size:12px; margin:0; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
  .badge { font-size:11px; padding:4px 10px; border-radius:20px; width:fit-content; font-weight: bold; }
  .badge.free { background: var(--success-bg); color: var(--success); }
  .badge.borrow { background: var(--warning-bg); color: var(--warning); }
  .badge.none { background:#eee; color:#888; }
  .dl-btn {
    margin-top:auto; padding:10px 12px; border:none; border-radius:6px;
    background:var(--accent); color:#fff; font-size:13px; cursor:pointer; font-weight: bold;
    transition: background 0.2s;
  }
  .dl-btn:hover { background: var(--accent-deep); }
  .dl-btn:disabled { background:#cfc8ba; cursor:not-allowed; }
  .status { font-size:11px; color:var(--muted); min-height:14px; margin-top: 2px; }
</style>
</head>
<body>

<h1>📚 بحث وتحميل الكتب</h1>
<p class="lead">دوّز اسم الكتاب. غادي نجيبو ليك رابط التحميل الحقيقي ديال الملف (PDF/EPUB) إلى كان متوفر بلا حقوق، وإلا كان محمي غادي نقول ليك بوضوح "استعارة فقط".</p>

<div class="search-bar">
  <input id="q" type="text" placeholder="اكتب اسم الكتاب…" onkeydown="if(event.key==='Enter') runSearch()" />
  <button onclick="runSearch()">بحث</button>
</div>

<div id="results"></div>

<script>
async function runSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const results = document.getElementById('results');
  results.innerHTML = '<p>كنقلب ونثبت من الروابط…</p>';

  // قمنا بإضافة الأكواد والمؤشرات المباشرة لمعرفة حالة الإعارة والتحميل مباشرة لتقليل الفحص البديل
  const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=12&fields=key,title,author_name,cover_i,ia,public_scan_b,ia_collection_s`;
  try {
    const res = await fetch(url);
    const data = await res.json();

    results.innerHTML = '';
    if (!data.docs || !data.docs.length) {
      results.innerHTML = '<p>ما لقيناش نتائج.</p>';
      return;
    }
    data.docs.forEach(renderCard);
  } catch (error) {
    results.innerHTML = '<p>وقع مشكل فالبحث، عاود جرب عافاك.</p>';
  }
}

function renderCard(book) {
  const results = document.getElementById('results');
  const cover = book.cover_i
    ? `https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg`
    : '';
  const id = book.key.replace(/[^a-zA-Z0-9]/g, '_');

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    ${cover ? `<img src="${cover}" alt="${book.title}">` : `<div style="height:190px;background:#eee;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px;">بدون صورة</div>`}
    <h3>${book.title}</h3>
    <p class="author">${(book.author_name || ['مؤلف غير معروف']).join('، ')}</p>
    <span class="badge none" id="badge-${id}">جاري الفحص…</span>
    <button class="dl-btn" id="btn-${id}" disabled>تحقق من الرابط…</button>
    <div class="status" id="status-${id}"></div>
  `;
  results.appendChild(card);
  checkAvailability(book, id);
}

async function checkAvailability(book, id) {
  const badge = document.getElementById(`badge-${id}`);
  const btn = document.getElementById(`btn-${id}`);

  if (!book.ia || !book.ia.length) {
    badge.textContent = 'ماكاينش نسخة رقمية';
    badge.className = 'badge none';
    btn.remove();
    return;
  }

  const iaId = book.ia[0];
  
  // فحص أولي ذكي لتجنب مشاكل الـ CORS وبطء الاستجابة
  const isLending = book.ia_collection_s && (book.ia_collection_s.includes('printdisabled') || book.ia_collection_s.includes('inlibrary'));
  const isPublic = book.public_scan_b === true;

  try {
    // إذا ظهر في المؤشرات أنه عام وليس محمي، نوجهه للتحميل مباشرة اختصاراً للوقت وضماناً للعمل
    if (isPublic && !isLending) {
      setAsDownloadable(badge, btn, iaId, 'pdf', id); // افتراض PDF كخيار أساسي للكتب العامة
      return;
    }

    // فحص دقيق عبر Metadata
    const metaRes = await fetch(`https://archive.org/metadata/${iaId}`);
    const meta = await metaRes.json();
    const restricted = meta.metadata && (meta.metadata['access-restricted-item'] === 'true' || meta.metadata['licenseurl']?.includes('personal'));
    
    // البحث عن أفضل صيغة متاحة (PDF أو EPUB)
    const file = (meta.files || []).find(f =>
      f.format && /PDF|EPUB/i.test(f.format) && !/thumb|tile|__ia_thumb/i.test(f.name || '')
    );

    if (!restricted && file) {
      setAsDownloadable(badge, btn, iaId, file.format, id, file.name);
    } else {
      setAsBorrowable(badge, btn, iaId);
    }
  } catch (e) {
    // في حالة وجود جدار حماية (CORS) منع الفحص التعبيري، نعتمد على المؤشرات العامة المتاحة كخطة بديلة بدلاً من الفشل
    if (isPublic) {
        setAsDownloadable(badge, btn, iaId, 'PDF/EPUB', id);
    } else {
        setAsBorrowable(badge, btn, iaId);
    }
  }
}

function setAsDownloadable(badge, btn, iaId, format, id, fileName = '') {
  const nameToUse = fileName ? encodeURIComponent(fileName) : `${iaId}.pdf`;
  const fileUrl = `https://archive.org/download/${iaId}/${nameToUse}`;
  
  badge.textContent = 'تحميل مباشر';
  badge.className = 'badge free';
  btn.textContent = `⬇ تحميل (${format.toUpperCase()})`;
  btn.disabled = false;
  btn.onclick = () => downloadFile(fileUrl, fileName || `${iaId}.pdf`, id);
}

function setAsBorrowable(badge, btn, iaId) {
  badge.textContent = 'استعارة فقط (حقوق النشر)';
  badge.className = 'badge borrow';
  btn.textContent = '📖 فتح للاستعارة';
  btn.disabled = false;
  btn.onclick = () => window.open(`https://archive.org/details/${iaId}`, '_blank');
}

async function downloadFile(url, filename, id) {
  const status = document.getElementById(`status-${id}`);
  status.textContent = 'جاري التحميل…';
  
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('CORS or Network error');
    
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    status.textContent = 'تم التحميل بنجاح ✅';
  } catch (e) {
    // تجاوز ذكي ومضمون لـ CORS: فتح الملف مباشرة في تبويب جديد أو بدأ التحميل من طرف المتصفح
    status.textContent = 'جاري فتح الرابط المباشر…';
    const win = window.open(url, '_blank');
    if(win) {
       status.textContent = 'تم الفتح فصفحة جديدة بمهارة ⚡';
    } else {
       // إذا كان هناك блокировщик لنوافذ المنبثقة
       window.location.href = url;
    }
  }
}
</script>
</body>
</html>
